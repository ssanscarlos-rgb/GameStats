name: Scala CI
on:
  push:
    paths: ['analytics-scala/**', 'samples/**', '.github/workflows/scala-ci.yml']
  pull_request:
    paths: ['analytics-scala/**', 'samples/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: sbt }
      - uses: sbt/setup-sbt@v1
      - name: Compile y tests
        run: sbt test
      - name: Empaquetar jar
        run: sbt assembly
      - name: Construir imagen Docker
        run: docker build -t gamestats-analyzer:${{ github.sha }} .
